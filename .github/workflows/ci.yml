name: CI

on:
  push:
    branches: [main, build/**]
  pull_request:

jobs:
  api-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rewards_test
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      JWT_ISSUER: rewards-api-test
      JWT_AUDIENCE: rewards-web-test
      APP_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      MIN_WITHDRAWAL_POINTS: 5000
      REFERRAL_COMMISSION_BPS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb rewards_test
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build API and web
        run: npm run build
      - name: Run integration tests
        run: npm test
