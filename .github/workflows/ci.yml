name: CI
# Blacksmith CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rewards_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rewards_test
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      JWT_ISSUER: rewards-api-test
      JWT_AUDIENCE: rewards-web-test
      APP_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      MIN_WITHDRAWAL_POINTS: 5000
      MAX_SINGLE_REWARD_POINTS: 10000000
      REFERRAL_COMMISSION_BPS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build API and web
        run: npm run build
      - name: Verify tracked migrations are idempotent
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Verify admin bootstrap
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin-ci@example.test
          BOOTSTRAP_ADMIN_USERNAME: admin-ci
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-12345
        run: npm run admin:bootstrap
      - name: Verify demo seed
        env:
          DEMO_SEED_ENABLED: "true"
          DEMO_USER_PASSWORD: ci-demo-password-12345
        run: npm run db:seed
      - name: Run integration tests
        run: npm test
      - name: Build production API image
        run: docker build -f Dockerfile.api -t rewards-api:ci .
      - name: Build production web image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 -f Dockerfile.web -t rewards-web:ci .
