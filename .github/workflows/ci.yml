name: CI
# Blacksmith fresh-branch verification

on:
  push:
    branches: [main, build/**, feature/**]

jobs:
  api-build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rewards_test
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      JWT_ISSUER: rewards-api-test
      JWT_AUDIENCE: rewards-web-test
      APP_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      MIN_WITHDRAWAL_POINTS: 5000
      MAX_SINGLE_REWARD_POINTS: 10000000
      REFERRAL_COMMISSION_BPS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start PostgreSQL
        run: |
          docker run -d --name rewards-postgres             -e POSTGRES_USER=postgres             -e POSTGRES_PASSWORD=postgres             -e POSTGRES_DB=rewards_test             -p 5432:5432             postgres:16
          for i in {1..30}; do
            if docker exec rewards-postgres pg_isready -U postgres -d rewards_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs rewards-postgres
          exit 1
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build API and web
        run: npm run build
      - name: Run integration tests
        run: npm test
